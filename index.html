<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>GB300 Web Emulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="console">

    <!-- SCREEN -->
    <div id="screen">

        <!-- BOOT -->
        <div id="bootScreen">

            <div class="boot-logo">
                GB300
            </div>

            <div class="boot-line">
                <span id="bootText">
                    POWER ON
                </span>
            </div>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

        </div>


        <!-- OS -->
        <div id="os" class="hidden">

            <header>

                <div class="os-title">
                    GB300
                </div>

                <div class="os-status">
                    ● ONLINE
                </div>

            </header>


            <main>

               <div class="platform">

    <button class="menu-item selected" data-index="0">
        <span class="icon">🎮</span>
        <span>GAMES</span>
    </button>

    <button class="menu-item" data-index="1">
        <span class="icon">💾</span>
        <span>ROMS</span>
    </button>

    <button class="menu-item" data-index="2">
        <span class="icon">★</span>
        <span>FAVORITES</span>
    </button>

    <button class="menu-item" data-index="3">
        <span class="icon">◷</span>
        <span>LAST PLAYED</span>
    </button>

    <button class="menu-item" data-index="4">
        <span class="icon">⚙</span>
        <span>TOOLS</span>
    </button>

</div>

<div id="romBrowser" class="hidden">

    <div class="browser-title">
        ROMS
    </div>

    <div id="systems"></div>

    <div id="romList" class="hidden"></div>

</div>
